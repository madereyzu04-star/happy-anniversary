<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Anniversary ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animasi hati -->
    <div class="hearts" aria-hidden="true">
        <span>❤️</span>
        <span>💗</span>
        <span>💕</span>
        <span>❤️</span>
        <span>💖</span>
        <span>💗</span>
        <span>💕</span>
    </div>


    <!-- HALAMAN 1 -->
    <section id="pembuka" class="container halaman">

        <div class="icon">💌</div>

        <h1>Happy Anniversary ❤️</h1>

        <p>
            Ada sesuatu yang ingin aku sampaikan...
        </p>

        <button type="button" onclick="bukaWebsite()">
            Buka 💕
        </button>

    </section>


    <!-- HALAMAN 2 -->
    <section id="utama" class="container halaman" hidden>

        <h1>Untuk Kamu ❤️</h1>

        <p>
            Selamat Anniversary!
            <br><br>
            Terima kasih sudah menjadi bagian
            dari cerita yang indah ini.
        </p>

        <button type="button" onclick="bukaPesan()">
            Lanjut 💌
        </button>

        <div id="pesan" class="pesan" hidden>

            <h2>💖 Terima Kasih 💖</h2>

            <p>
                Semoga kita selalu memiliki banyak
                kenangan indah untuk diceritakan.
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
