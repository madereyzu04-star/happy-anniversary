<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Anniversary ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Hati yang bergerak -->
    <div class="hearts">
        <span>❤️</span>
        <span>💗</span>
        <span>💕</span>
        <span>❤️</span>
        <span>💖</span>
        <span>💗</span>
        <span>💕</span>
    </div>

    <!-- Halaman pembuka -->
    <div id="pembuka" class="container">

        <div class="icon">💌</div>

        <h1>Happy Anniversary ❤️</h1>

        <p>
            Ada sesuatu yang ingin aku sampaikan...
        </p>

        <button onclick="bukaWebsite()">
            Buka 💕
        </button>

    </div>


    <!-- Halaman utama -->
    <div id="utama" class="container hidden">

        <h1>Untuk Kamu ❤️</h1>

        <p>
            Selamat Anniversary!
            <br><br>
            Terima kasih sudah menjadi bagian
            dari cerita yang indah ini.
        </p>

        <button onclick="bukaPesan()">
            Lanjut 💌
        </button>

        <div id="pesan" class="pesan hidden">

            <h2>💖 Terima Kasih 💖</h2>

            <p>
                Semoga kita selalu memiliki banyak
                kenangan indah untuk diceritakan.
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
